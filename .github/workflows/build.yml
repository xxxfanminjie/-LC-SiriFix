name: Build Dylib
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode info
        run: xcode-select -p && xcodebuild -version

      - name: Compile dylib
        run: |
          xcrun clang -arch arm64 -arch arm64e \
          -isysroot $(xcrun -sdk iphoneos --show-sdk-path) \
          -fobjc-arc -dynamiclib \
          BypassSiriCrash.m \
          -o BypassSiriCrash.dylib
          -framework Intents
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BypassSiriCrash-dylib
          path: BypassSiriCrash.dylib
